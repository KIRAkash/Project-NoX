[project]
name = "nox-api"
version = "0.1.0"
description = "NoX API: knowledge-base engine, missions and integrations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "PyGithub>=2.3",
    "google-genai>=1.0",
    "google-cloud-storage>=2.17",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "markitdown>=0.0.1",
    "python-dotenv>=1.0",
    "markdown>=3.6",
    "google-adk>=2.10.0",
    "pgvector>=0.5.0",
    "pyyaml>=6",
    "google-cloud-firestore>=2.19",
    "mcp>=1.10",
    "a2a-sdk>=0.3",
    "google-cloud-bigquery>=3.25",
]

[project.optional-dependencies]
local = [
    "litellm>=1.60",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nox_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls real external services (needs a filled .env)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E712: SQLAlchemy column comparisons (`col == True`) are intentional.
# The rest are style findings in older engine code; tighten as files are touched.
ignore = ["E501", "B008", "E712", "B904", "UP042", "E741", "E722", "E701", "B007", "F841", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"nox_api/connectors/__init__.py" = ["F401"]  # re-exports
"nox_api/main.py" = ["E402"]
